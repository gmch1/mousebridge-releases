name: Publish verified download

on:
  push:
    branches: [main]
    paths: ['incoming/**']
  workflow_dispatch:

concurrency:
  group: public-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public payload and Ed25519 signatures
        run: python3 scripts/verify.py incoming
      - name: Publish immutable version and rolling update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py incoming
